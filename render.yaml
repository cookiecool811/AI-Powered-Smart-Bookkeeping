services:
  - type: web
    name: ai-expense-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ZHIPUAI_API_KEY
        sync: false
      - key: ZHIPUAI_MODEL
        value: glm-4.7-flash
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_TO
        sync: false
