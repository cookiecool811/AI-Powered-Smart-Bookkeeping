<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 智能记账</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app">

  <!-- ===== AI 记账页（默认首页） ===== -->
  <div class="tab-page active" id="page-ai">
    <header class="page-header">
      <div class="ai-page-head">
        <span class="robot">🤖</span>
        <span class="ai-page-title">AI 智能记账</span>
      </div>
    </header>
    <div class="ai-page-content">
      <textarea id="input" class="ai-input" placeholder="告诉 AI 你的消费……" rows="4"></textarea>
      <button id="submit" class="ai-submit">智能记账</button>
      <div id="message" class="ai-message"></div>
      <div class="export-row">
        <select id="rangeSelect" class="export-select">
          <option value="all" selected>导出：全部</option>
          <option value="month">导出：本月</option>
          <option value="year">导出：本年</option>
          <option value="custom">导出：自定义</option>
        </select>
        <div id="customRange" class="custom-range">
          <input type="date" id="startDate"><span>~</span><input type="date" id="endDate">
        </div>
        <button id="exportBtn" class="export-btn">确认导出</button>
      </div>
    </div>
  </div>

  <!-- ===== 明细页 ===== -->
  <div class="tab-page" id="page-list">
    <header class="page-header">
      <div class="header-top">
        <span class="smile">◕‿◕</span>
        <h1 class="app-title">AI 记账</h1>
        <span class="spacer"></span>
      </div>
      <div class="header-bottom">
        <div class="month-select" id="monthLabel">
          <input type="month" id="monthPicker" class="month-picker">
        </div>
        <div class="ie-group">
          <div class="ie-col"><span>收入</span><strong id="monthIncome">0.00</strong></div>
          <div class="ie-col"><span>支出</span><strong id="monthExpense">¥0.00</strong></div>
        </div>
      </div>
    </header>

    <div class="list-content">
      <div id="recordsList" class="records-list"></div>
    </div>
  </div>

  <!-- ===== 图表页 ===== -->
  <div class="tab-page" id="page-chart">
    <header class="page-header">
      <div class="chart-title-row" id="typeToggle">
        <span id="typeLabel">支出</span> <span class="dropdown-arrow">▾</span>
        <div class="type-dropdown" id="typeDropdown">
          <div class="type-option" data-type="expense">
            <span class="type-icon">⬆️</span><span>支出</span><span class="type-check" id="checkExpense">✓</span>
          </div>
          <div class="type-option" data-type="income">
            <span class="type-icon">⬇️</span><span>收入</span><span class="type-check" id="checkIncome"></span>
          </div>
        </div>
      </div>
      <div class="period-tabs">
        <button class="period-tab active" data-period="week">周</button>
        <button class="period-tab" data-period="month">月</button>
        <button class="period-tab" data-period="year">年</button>
      </div>
    </header>

    <div class="chart-content">
      <div class="period-label" id="periodLabel">本周</div>
      <div class="period-stats">
        <div><span>总支出</span><strong id="periodTotal">¥0.00</strong></div>
        <div><span>平均值</span><strong id="periodAvg">¥0.00</strong></div>
      </div>

      <div class="line-chart-card">
        <canvas id="lineChart"></canvas>
      </div>

      <div class="rank-section">
        <div class="rank-title">支出排行榜</div>
        <div id="categoryRank" class="category-rank"></div>
      </div>

      <div class="doughnut-card">
        <div class="rank-title">分类占比</div>
        <div class="chart-wrap"><canvas id="doughnutChart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ===== 发现页 ===== -->
  <div class="tab-page" id="page-discover">
    <header class="page-header">
      <div class="discover-title">发现</div>
    </header>
    <div class="discover-content">

      <!-- 账单卡片 -->
      <div class="discover-card">
        <div class="card-head">
          <span class="card-title">账单</span>
          <span class="arrow">›</span>
        </div>
        <div class="bill-row">
          <div class="bill-month"><span id="billMonth">09</span><span class="bill-unit">月</span></div>
          <div class="bill-col"><span>收入</span><strong id="billIncome">0.00</strong></div>
          <div class="bill-col"><span>支出</span><strong id="billExpense">0.00</strong></div>
          <div class="bill-col"><span>结余</span><strong id="billBalance">0.00</strong></div>
        </div>
      </div>

      <!-- 预算卡片 -->
      <div class="discover-card">
        <div class="card-head">
          <span class="card-title" id="budgetTitle">09月总预算</span>
          <button class="budget-set-btn" id="budgetSetBtn">+ 设置预算</button>
        </div>
        <div class="budget-body">
          <div class="budget-ring">
            <svg viewBox="0 0 120 120" class="ring-svg">
              <circle cx="60" cy="60" r="50" fill="none" stroke="#E8E8E8" stroke-width="12"/>
              <circle cx="60" cy="60" r="50" fill="none" stroke="#FFD93D" stroke-width="12"
                stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"
                transform="rotate(-90 60 60)" id="ringProgress"/>
            </svg>
            <div class="ring-text">
              <span class="ring-label">剩余</span>
              <span class="ring-percent" id="ringPercent">0%</span>
            </div>
          </div>
          <div class="budget-info">
            <div class="budget-line"><span>剩余预算：</span><strong id="budgetRemain">0.00</strong></div>
            <div class="budget-line"><span>本月预算：</span><strong id="budgetTotal">0.00</strong></div>
            <div class="budget-line"><span>本月支出：</span><strong id="budgetSpent">0.00</strong></div>
          </div>
        </div>
      </div>

      <!-- 资产管家卡片 -->
      <div class="discover-card">
        <div class="card-head">
          <span class="card-title">资产管家</span>
          <span class="arrow">›</span>
        </div>
        <div class="asset-row">
          <div class="asset-col"><span>净资产</span><strong>0.00</strong></div>
          <div class="asset-col"><span>资产</span><strong>0.00</strong></div>
          <div class="asset-col"><span>负债</span><strong>0.00</strong></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== 我的页 ===== -->
  <div class="tab-page" id="page-me">
    <header class="page-header me-header">
      <div class="profile-row">
        <div class="avatar">🐱</div>
        <div class="profile-info">
          <div class="username">Adrian</div>
        </div>
      </div>
    </header>

    <div class="me-content">
      <div class="menu-group">
        <div class="menu-item"><span class="mi-icon">📒</span>我的账本<span class="arrow">›</span></div>
        <div class="menu-item"><span class="mi-icon">⚙️</span>设置<span class="arrow">›</span></div>
        <div class="menu-item"><span class="mi-icon">💡</span>使用帮助<span class="arrow">›</span></div>
        <div class="menu-item"><span class="mi-icon">✏️</span>意见反馈<span class="arrow">›</span></div>
      </div>
    </div>
  </div>

  <!-- ===== 底部导航 (图一) ===== -->
  <nav class="bottom-nav">
    <button class="nav-item" data-tab="list">
      <span class="nav-icon">📋</span><span class="nav-text">明细</span>
    </button>
    <button class="nav-item" data-tab="chart">
      <span class="nav-icon">📈</span><span class="nav-text">图表</span>
    </button>
    <button class="nav-add" data-tab="ai">
      <span class="add-ring"><span class="add-circle">＋</span></span>
      <span class="nav-text add-text">记账</span>
    </button>
    <button class="nav-item" data-tab="discover">
      <span class="nav-icon">🌍</span><span class="nav-text">发现</span>
    </button>
    <button class="nav-item" data-tab="me">
      <span class="nav-icon">👤</span><span class="nav-text">我的</span>
    </button>
  </nav>

</div>
<script src="/static/app.js"></script>
</body>
</html>
