<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 智能记账</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app">

  <!-- 黄色头部 -->
  <header class="app-header">
    <div class="header-top">
      <span class="smile">◕‿◕</span>
      <h1>AI 记账</h1>
      <span class="header-spacer"></span>
    </div>
    <div class="header-summary">
      <div class="month-selector" id="monthLabel">2026年 09月 ▾</div>
      <div class="ie-row">
        <div class="ie-item"><span>收入</span><strong>0.00</strong></div>
        <div class="ie-item"><span>支出</span><strong id="monthExpense">¥0.00</strong></div>
      </div>
    </div>
  </header>

  <div class="content">

    <!-- AI 记账输入卡片 -->
    <section class="ai-card" id="aiCard">
      <div class="ai-label">🤖 AI 智能记账</div>
      <textarea id="input" placeholder="告诉 AI 你的消费……" rows="2"></textarea>
      <button id="submit">智能记账</button>
      <div id="message" class="message"></div>
      <div class="range-bar">
        <select id="rangeSelect" class="range-select">
          <option value="current" selected>导出：本次</option>
          <option value="all">导出：全部</option>
          <option value="month">导出：本月</option>
          <option value="year">导出：本年</option>
          <option value="custom">导出：自定义</option>
        </select>
        <div id="customRange" class="custom-range">
          <input type="date" id="startDate"><span>~</span><input type="date" id="endDate">
        </div>
        <button id="exportBtn" class="export-btn">确认导出</button>
      </div>
    </section>

    <!-- 明细 Tab -->
    <div class="tab-content active" id="tab-list">
      <div id="recordsList" class="records-list"></div>
    </div>

    <!-- 图表 Tab -->
    <div class="tab-content" id="tab-chart">
      <div class="chart-card">
        <div class="chart-title">分类消费</div>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">分类金额</div>
        <div id="categoryList" class="category-list"></div>
      </div>
    </div>

    <!-- 查询 Tab -->
    <div class="tab-content" id="tab-query">
      <div class="query-card">
        <div class="chart-title">消费查询</div>
        <div class="query-controls">
          <select id="queryRange" class="range-select">
            <option value="month">本月</option>
            <option value="year">本年</option>
            <option value="all" selected>全部</option>
            <option value="custom">自定义</option>
          </select>
          <div id="queryCustomRange" class="custom-range">
            <input type="date" id="queryStartDate"><span>~</span><input type="date" id="queryEndDate">
          </div>
          <button id="queryBtn" class="query-btn">查询</button>
        </div>
        <div class="query-result">
          <div class="query-result-item"><span>时间范围</span><strong id="queryRangeLabel">全部</strong></div>
          <div class="query-result-item"><span>消费总金额</span><strong id="queryTotal">¥0.00</strong></div>
          <div class="query-result-item"><span>记录笔数</span><strong id="queryCount">0 笔</strong></div>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="list">
      <span class="nav-icon">📋</span><span class="nav-text">明细</span>
    </button>
    <button class="nav-item" data-tab="chart">
      <span class="nav-icon">📊</span><span class="nav-text">图表</span>
    </button>
    <button class="nav-add" id="addBtn">＋</button>
    <button class="nav-item" data-tab="query">
      <span class="nav-icon">🔍</span><span class="nav-text">查询</span>
    </button>
    <button class="nav-item" data-tab="settings">
      <span class="nav-icon">👤</span><span class="nav-text">我的</span>
    </button>
  </nav>

  <!-- 我的 Tab 内容（简单信息） -->
  <div class="tab-content" id="tab-settings" style="display:none">
    <div class="settings-card">
      <div class="settings-row"><span>AI 模型</span><strong>GLM-4.7-Flash</strong></div>
      <div class="settings-row"><span>数据库</span><strong>SQLite 本地</strong></div>
      <div class="settings-row"><span>邮件推送</span><strong>已开启</strong></div>
      <div class="settings-row"><span>总记录数</span><strong id="totalCount">0 笔</strong></div>
      <div class="settings-row"><span>总消费</span><strong id="totalAmount">¥0.00</strong></div>
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
